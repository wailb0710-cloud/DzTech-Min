<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Dz-Orientation (DzTech Mind)</title>
    <meta name="theme-color" content="#021a14" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="https://picsum.photos/seed/dztech/32/32" />
    <script>
      // Force unregister stale service workers and clear legacy cache
      try {
        if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister().catch(function(){});
            }
          }).catch(function(){});
        }
        if ('caches' in window && caches.keys) {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) {
              caches.delete(names[i]).catch(function(){});
            }
          }).catch(function(){});
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#021a14] text-emerald-50 font-sans antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #021a14; color: #ffffff; font-family: 'Cairo', system-ui, -apple-system, sans-serif; text-align: center; padding: 20px;" dir="rtl">
        <div style="width: 56px; height: 56px; border: 4px solid rgba(245, 158, 11, 0.2); border-top-color: #f59e0b; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px;"></div>
        <h2 style="font-size: 22px; font-weight: 800; margin: 0 0 8px 0; color: #fef3c7; font-family: 'Cairo', sans-serif;">جاري تحميل تحفة DzTech (Dz-Orientation)...</h2>
        <p style="font-size: 14px; color: #6ee7b7; margin: 0; font-family: 'Tajawal', sans-serif;">منصة التوجيه التكويني والجامعي الفاخرة بالجزائر</p>
        <style>
          @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
